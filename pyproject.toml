[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlispcc"
version = "0.1.25"
description = "Atlisp Compiler Collection: FAS4 bytecode compiler and decompiler toolchain for AutoLISP-compatible CAD platforms"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.3.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "readme-renderer>=40.0",
    "twine>=5.0.0",
]

[project.scripts]
atlispcc = "compiler.cli:main"

[tool.setuptools.packages.find]
include = ["compiler*", "asm*", "core*", "decompiler*", "tools*"]
namespaces = false

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py38"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
